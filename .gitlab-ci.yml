stages:
  - lint
  - build
  - docker
# store npm's downloaded packages/cache here:
variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
# Save .npm/ between pipeline jobs/runs so npm doesn't need to download everything from the internet every time.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
# By default, run my jobs inside a container containing Node.js 20.
default:
  image: node:20-alpine
#jobs
lint:
  stage: lint
  script:
    - npm ci --cache .npm --prefer-offline  
    - npm run lint

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY 

  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA . #Location+commit id
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest