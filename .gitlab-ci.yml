stages:
  - lint
  - build
  # - test
  - docker


# --------------------------------------------------
# GLOBAL CONFIG
# --------------------------------------------------

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"


cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/


default:
  image: node:20-alpine


# --------------------------------------------------
# LINT
# --------------------------------------------------

lint:
  stage: lint

  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint


# --------------------------------------------------
# BUILD
# --------------------------------------------------

build:
  stage: build

  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build

  artifacts:
    paths:
      - dist/
    expire_in: 1 week


